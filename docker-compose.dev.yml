# Local stand-in for Neon, for working on accounts without a cloud
# database. Postgres, plus the HTTP proxy that @neondatabase/serverless
# talks to — the driver speaks Neon's SQL-over-HTTP protocol, so a
# plain Postgres needs something in front of it.
#
#   docker compose -f docker-compose.dev.yml up -d
#   npm run migrate
#   npm run dev
#
# Point the app at it with DATABASE_URL and NEON_LOCAL_PROXY in
# .env.development.local — see the README. Production talks to Neon
# directly and never loads either of those.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: main
    # 5433 on the host: 5432 is often already taken by a local install
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@db:5432/main
    ports:
      - "4444:4444"
    depends_on:
      db:
        condition: service_healthy
